<h2>Hola, {{ usuario()?.name }}</h2>
<p class="sub">¿Qué quieres hacer hoy?</p>

<div class="grilla">
  @for (item of menu(); track item.titulo) {
    @if (item.ruta) {
      <a class="enlace" [routerLink]="item.ruta">
        <mat-card appearance="outlined" class="tarjeta">
          <mat-card-header>
            <mat-icon class="icono" fontSet="material-symbols-outlined">{{ item.icono }}</mat-icon>
            <mat-card-title>{{ item.titulo }}</mat-card-title>
            <mat-card-subtitle>{{ item.descripcion }}</mat-card-subtitle>
          </mat-card-header>
        </mat-card>
      </a>
    } @else {
      <mat-card appearance="outlined" class="tarjeta pronto">
        <mat-card-header>
          <mat-icon class="icono" fontSet="material-symbols-outlined">{{ item.icono }}</mat-icon>
          <mat-card-title>{{ item.titulo }}</mat-card-title>
          <mat-card-subtitle>Próximamente</mat-card-subtitle>
        </mat-card-header>
      </mat-card>
    }
  }
</div>
